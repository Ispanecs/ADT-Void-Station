- type: entity
  parent: ADTMusicDiskStandard
  id: MusicDiscVoidMix
  name: музыкальный диск (Пустотный микс)
  description: Самые разные треки, собранные со всех известных пустотных секторов в единый носитель.
  components:
  - type: Sprite
    sprite: ADT/Objects/Misc/music_disk.rsi
    layers:
    - state: disk_base
      color: "#191919"
    - state: disk_label_music
  - type: JukeboxDisk
    tracksCollection: VoidMix
  - type: StaticPrice
    price: 50

